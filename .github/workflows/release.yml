name: Release

on:
  workflow_dispatch:

permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Read version from go.mod
        id: read
        run: |
          version=$(grep '^// AppVersion ' go.mod | awk '{print $3}')
          if [ -z "$version" ]; then
            echo "::error::AppVersion not found in go.mod"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: version
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      matrix:
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/spt .

      - name: Create archive
        run: |
          cd dist
          tar czf "spt-${VERSION}-linux-${{ matrix.goarch }}.tar.gz" spt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spt-linux-${{ matrix.goarch }}
          path: dist/spt-${{ env.VERSION }}-linux-${{ matrix.goarch }}.tar.gz

  build-msi:
    needs: version
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build spt.exe
        run: go build -trimpath -ldflags="-s -w" -o installer/spt.exe .

      - name: Install WiX v5
        run: dotnet tool install --global wix --version 5.0.0

      - name: Prepare MSI version
        id: msi-ver
        shell: pwsh
        run: |
          $v = "${{ env.VERSION }}" -replace '^v', ''
          $parts = $v -split '\.'
          while ($parts.Count -lt 4) { $parts += '0' }
          $msiVer = ($parts[0..3]) -join '.'
          echo "msi_version=$msiVer" >> $env:GITHUB_OUTPUT

      - name: Build MSI
        run: wix build installer/spt.wxs -o installer/spt-${{ env.VERSION }}.msi -b installer -d Version=${{ steps.msi-ver.outputs.msi_version }}

      - name: Create Windows zip
        shell: pwsh
        run: Compress-Archive -Path installer/spt.exe -DestinationPath "installer/spt-${{ env.VERSION }}-windows-amd64.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spt-windows-msi
          path: installer/spt-${{ env.VERSION }}.msi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spt-windows-zip
          path: installer/spt-${{ env.VERSION }}-windows-amd64.zip

  release:
    needs: [version, build-linux, build-msi]
    permissions:
      contents: write
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    outputs:
      sha_linux_amd64: ${{ steps.shas.outputs.linux_amd64 }}
      sha_linux_arm64: ${{ steps.shas.outputs.linux_arm64 }}
      sha_windows_amd64: ${{ steps.shas.outputs.windows_amd64 }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256
        id: shas
        run: |
          cd artifacts
          {
            echo "linux_amd64=$(sha256sum "spt-${VERSION}-linux-amd64.tar.gz" | awk '{print $1}')"
            echo "linux_arm64=$(sha256sum "spt-${VERSION}-linux-arm64.tar.gz" | awk '{print $1}')"
            echo "windows_amd64=$(sha256sum "spt-${VERSION}-windows-amd64.zip" | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          files: artifacts/*
          draft: false
          prerelease: false
          overwrite_files: true

  bump-tap:
    needs: [version, release]
    permissions: {}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHA_LINUX_AMD64: ${{ needs.release.outputs.sha_linux_amd64 }}
      SHA_LINUX_ARM64: ${{ needs.release.outputs.sha_linux_arm64 }}
      SHA_WIN: ${{ needs.release.outputs.sha_windows_amd64 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: T4ko0522/tap
          token: ${{ secrets.BUCKET_TOKEN }}

      - name: Update Scoop manifest
        run: |
          VERSION_NO_V="${VERSION#v}"
          mkdir -p bucket
          cat > bucket/spt.json <<EOF
          {
              "version": "${VERSION_NO_V}",
              "description": "Control Spotify from your terminal. TUI + CLI.",
              "homepage": "https://github.com/T4ko0522/Spotify-CLI",
              "license": "Apache-2.0",
              "architecture": {
                  "64bit": {
                      "url": "https://github.com/T4ko0522/Spotify-CLI/releases/download/${VERSION}/spt-${VERSION}-windows-amd64.zip",
                      "hash": "${SHA_WIN}"
                  }
              },
              "bin": "spt.exe",
              "checkver": "github",
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/T4ko0522/Spotify-CLI/releases/download/v\$version/spt-v\$version-windows-amd64.zip"
                      }
                  }
              }
          }
          EOF

      - name: Update Homebrew formula
        run: |
          VERSION_NO_V="${VERSION#v}"
          mkdir -p Formula
          cat > Formula/spt.rb <<EOF
          class Spt < Formula
            desc "Control Spotify from your terminal. TUI + CLI"
            homepage "https://github.com/T4ko0522/Spotify-CLI"
            version "${VERSION_NO_V}"
            license "Apache-2.0"

            on_linux do
              on_intel do
                url "https://github.com/T4ko0522/Spotify-CLI/releases/download/${VERSION}/spt-${VERSION}-linux-amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
              on_arm do
                url "https://github.com/T4ko0522/Spotify-CLI/releases/download/${VERSION}/spt-${VERSION}-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
            end

            def install
              bin.install "spt"
            end

            test do
              system bin/"spt", "--help"
            end
          end
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/spt.json Formula/spt.rb
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "spt: ${VERSION}"
          git push
